name: Sync to Gitee

on:
  schedule:
    # 美股收盘后（16:00 ET）立即同步：UTC 21:30 = 北京 05:30（冬令时收盘 21:00 UTC 后 30 分钟）
    - cron: '30 21 * * 1-5'
    # 聚宽日报（北京 08:00）前再同步一次，双保险覆盖 Actions 排队延迟
    - cron: '30 23 * * 1-5'   # UTC 23:30 = 北京时间 07:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Sync CSV to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python scripts/sync_to_gitee.py

      # 同时把文件提交回 fork，避免 GitHub 因 60 天无活动暂停定时任务
      - name: Keep fork active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fear-greed.csv vix_history.csv
          git diff --cached --quiet || git commit -m "data: sync ($(date -u +%F))"
          git push
